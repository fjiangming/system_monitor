name: Verify, build and publish
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          SYSTEM_MONITOR_DOCKER_TEST: '1'
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: artifacts/browser
  build:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 15
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          target='${{ matrix.target }}'
          export GOOS="${target%-*}" GOARCH="${target#*-}" CGO_ENABLED=0
          mkdir -p dist
          output="dist/system-monitor-$target"
          if [ "$GOOS" = windows ]; then output="$output.exe"; fi
          go build -trimpath -ldflags='-s -w' -o "$output" .
          sha256sum "$output" > "$output.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: system-monitor-${{ matrix.target }}
          path: dist/*
  docker:
    runs-on: ${{ matrix.runner }}
    needs: verify
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: system-monitor:ci
          cache-from: |
            type=gha,scope=image-${{ matrix.arch }}
            type=gha,scope=image-published
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Verify image, persistent storage and host agent package
        run: sh scripts/image-check.sh system-monitor:ci
      - name: Verify Compose isolation and Nginx HTTPS access
        run: node scripts/compose-check.cjs system-monitor:ci
  publish:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    needs: [verify, build, docker]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve registry image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
      - name: Publish verified multi-platform image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
            type=gha,scope=image-published
          cache-to: type=gha,mode=max,scope=image-published
      - name: Verify registry manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/published-manifest.json"
          jq -e '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' "$RUNNER_TEMP/published-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: published-image-manifest
          path: ${{ runner.temp }}/published-manifest.json
